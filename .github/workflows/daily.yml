name: daily-report

on:
  schedule:
    - cron: "30 21 * * 0-4"  # 매주 월~금 06:30 KST (전날 장 마감 데이터)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices
        run: python pipeline/fetch.py

      - name: Analyze
        run: python pipeline/analyze.py

      - name: Commit report
        run: |
          # 새 거래일 데이터가 없으면(휴장일) 커밋하지 않는다
          if git diff --quiet -- docs/data/breadth.json docs/data/snapshots.json; then
            echo "no new trading data"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "report: $(jq -r .last_date docs/data/meta.json)"
          git push
